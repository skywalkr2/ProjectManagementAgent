# A fictional packs catalog feed. Every name here is invented.
version: 1
packs:
  - id: bindery
    name: Bindery pack
    summary: Takes a finished manuscript to a printable book.
    publisher: Quillwork Tools
    maintainers: true
    updated: "2030-03-01"
    version: 1.2.0
    plugin_api: ">=0.3,<0.4"
    price: {model: subscription, amount: 9, currency: USD, period: month, note: Free for one book}
    homepage: https://packs.example.com/bindery
    install: uv tool install --with bindery-pack pm-cockpit
    demo: true
    ai_jobs:
      - {label: Drafting a chapter, input_tokens: 6000, output_tokens: 4000}
      - {label: A full edit pass, input_tokens: 90000, output_tokens: 30000, role: check, data_level: restricted}
    provides:
      record_types: [bindery/book, bindery/chapter]
      panels: [bindery/books]
      today: [bindery/next-steps]
      ai_task_kinds: [bindery/draft, bindery/edit]
      sign_ins: [bindery/print-service]
    requires:
      network: [print.example.com]
      secrets: [client-id]
      data_levels: [open, internal, restricted]
      tools: [{name: ebook-checker, version_command: ebook-checker --version}]
  - id: Not-Valid
    name: Broken
  - id: bindery
    name: Bindery again
  - id: ledgerline
    name: Ledgerline
    summary: Orders and invoices for a small shop.
    plugin_api: ">=0.9"
    price: {model: free}
    homepage: http://packs.example.com/ledgerline
