# The fictional week of mail for the two-sides test (from the owner's outside helper; mail-21 kept as business:
# a business-only client paying a Greenline invoice). People and relations: sides-people.yaml beside this file.
person: {name: Robin Hale, address: robin@example.com, business: Greenline Gardens}
emails:
  - {id: mail-01, from: "Mara Hale <mara.hale@example.com>", subject: "Sunday dinner", side: personal, body: "Hey Robin,\nMom is making her usual casserole this Sunday at six.\nCan you bring dessert? Elliot and Nora are welcome, of course."}
  - {id: mail-02, from: "Milo Trent <milo.trent@example.com>", subject: "Back garden cleanup", side: business, body: "Hi Robin,\nCould your crew clear the fallen branches and trim the hedges next Thursday?\nPlease confirm the price before scheduling the visit."}
  - {id: mail-03, from: "Quinn Mercer <quinn.mercer@example.com>", subject: "A few receipts missing", side: unclear, body: "Hi Robin,\nI'm missing receipts for several purchases from last month.\nSome may be household expenses and others Greenline expenses.\nCould you send the outstanding receipts by Friday?"}
  - {id: mail-04, from: "Dr. Sella Venn <sella.venn@example.org>", subject: "Cleaning appointment reminder", side: personal, body: "Hello Robin,\nThis is a reminder of your dental cleaning on Wednesday at 10:30 a.m.\nPlease reply if you need to reschedule."}
  - {id: mail-05, from: "Soren Beck <soren.beck@example.net>", subject: "Mulch delivery confirmation", side: business, body: "Robin,\nYour order of 24 bags of cedar mulch is scheduled for Tuesday morning.\nPlease make sure someone is available to receive the delivery."}
  - {id: mail-06, from: "Gavin Moss <gavin.moss@example.net>", subject: "Game night?", side: personal, body: "Hey,\nA few of us are getting together Friday around seven.\nBring a game if you have one you want to try."}
  - {id: mail-07, from: "Kira Moss <kira.moss@example.com>", subject: "Tuesday route finished", side: business, body: "Hi Robin,\nI've finished the three scheduled properties and uploaded the photos.\nThe last client's side gate was locked, so I couldn't trim that section.\nLet me know if you want me to return tomorrow."}
  - {id: mail-08, from: "Iris Bell <iris.bell@example.org>", subject: "Permission slip due", side: personal, body: "Hello Robin,\nNora's class is visiting the nature center next Friday.\nPlease return the signed permission slip by Wednesday."}
  - {id: mail-09, from: "Felix Rowan <felix.rowan@example.org>", subject: "That patio idea", side: unclear, body: "Hey Robin,\nI was thinking about the patio we discussed at my place.\nCould you stop by this weekend and look at the space?\nWe can grab lunch afterward either way."}
  - {id: mail-10, from: "Celia North <celia.north@example.org>", subject: "Revised planting plan", side: business, body: "Hi Robin,\nI've attached the updated sketch for the front beds.\nPlease use the revised plant spacing and confirm the installation date."}
  - {id: mail-11, from: "Perry Dole <perry.dole@example.net>", subject: "Your car is ready", side: personal, body: "Hi Robin,\nThe brake pads have been replaced, and the inspection is complete.\nYou can collect the car after 3 p.m."}
  - {id: mail-12, from: "Nadia Wren <nadia.wren@example.net>", subject: "Unusual account activity", side: unclear, body: "Hello Robin,\nWe noticed a transfer that differs from your usual activity.\nPlease confirm whether you initiated it."}
  - {id: mail-13, from: "Della Quill <della.quill@example.com>", subject: "Invoice for September work", side: business, body: "Hi Robin,\nCould you send the invoice for the lawn maintenance completed last month?"}
  - {id: mail-14, from: "Tessa Wynn <tessa.wynn@example.com>", subject: "Borrowing the folding chairs", side: personal, body: "Hi Robin,\nAre your folding chairs still in the garage?\nI'd love to borrow them for my birthday gathering on Saturday."}
  - {id: mail-15, from: "Jude Fen <jude.fen@example.org>", subject: "Hours for this week", side: business, body: "Morning Robin,\nI've logged 32 hours this week and added the extra cleanup visit.\nCan you approve the timesheet before payroll closes tomorrow?"}
  - {id: mail-16, from: "Lena Frost <lena.frost@example.org>", subject: "Your monthly statement", side: personal, body: "Hello Robin,\nYour latest statement is available.\nThe amount due is 146.20, payable by the 28th."}
  - {id: mail-17, from: "Vera Lorne <vera.lorne@example.net>", subject: "Request for a landscaping quote", side: business, body: "Hello,\nI'm looking for someone to redesign two planting beds and install a small hedge.\nCould you provide an estimate after visiting the property?"}
  - {id: mail-18, from: "Alden Shore <alden.shore@example.com>", subject: "Policy renewal coming up", side: unclear, body: "Hi Robin,\nOne of your policies renews next month.\nI manage both your household and Greenline coverage."}
  - {id: mail-19, from: "Oren Vance <oren.vance@example.net>", subject: "Watering system follow-up", side: business, body: "Robin,\nThe new planting looks good, but the drip line seems to be leaking.\nCould you inspect it during your next scheduled visit?"}
  - {id: mail-20, from: "Elliot Hale <elliot.hale@example.com>", subject: "Groceries for tonight", side: personal, body: "Can you pick up milk, bread, and apples on your way home?"}
  - {id: mail-21, from: "Bram Alder <bram.alder@example.org>", subject: "Payment received", side: business, body: "Hi Robin,\nI've sent payment for the autumn cleanup invoice.\nPlease confirm once it appears in your records."}
  - {id: mail-22, from: "Maeve Rill <maeve.rill@example.org>", subject: "Quick question about Saturday", side: unclear, body: "Hi Robin,\nWould you have time Saturday morning to take a look at the shrubs by my driveway?"}
  - {id: mail-23, from: "Mara Hale <mara.hale@example.com>", subject: "Mom's birthday present", side: personal, body: "Robin,\nCan you send me the family pictures from last summer by Thursday?"}
  - {id: mail-24, from: "Soren Beck <soren.beck@example.net>", subject: "Outstanding supplier invoice", side: business, body: "Hi Robin,\nInvoice GL-284 is still showing as unpaid in our records.\nCould you arrange payment by Friday?"}
