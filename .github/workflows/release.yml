name: release

# A tag like v0.2.0 builds the package (web screens included) and attaches it, with the install scripts, to a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync
      - run: npm --prefix web ci
      - name: Build the web screens
        run: npm --prefix web run build
      - name: Checks
        run: |
          uv run ruff check .
          uv run pytest
          uv run python -m engine.selfcheck
      - name: Fill in where feedback goes and the packs catalog (repository variables; empty when unset)
        env:
          FEEDBACK_TO: ${{ vars.FEEDBACK_TO }}
          PACK_CATALOG: ${{ vars.PACK_CATALOG }}
        run: |
          {
            if [ -n "$FEEDBACK_TO" ]; then printf 'feedback_to: "%s"\n' "$FEEDBACK_TO"; else echo "feedback_to: null"; fi
            if [ -n "$PACK_CATALOG" ]; then printf 'pack_catalog: "%s"\n' "$PACK_CATALOG"; else echo "pack_catalog: null"; fi
          } > catalog/product.yaml
      - name: Build the package
        run: uv build --wheel -o dist
      - name: Install it in a clean environment and start the demo
        run: |
          uv venv /tmp/try
          VIRTUAL_ENV=/tmp/try uv pip install dist/*.whl
          HOME=/tmp/try-home timeout 20 /tmp/try/bin/cockpit demo --no-open > /tmp/demo.log 2>&1 &
          sleep 8
          grep -q "Open http" /tmp/demo.log
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl deploy/install.sh deploy/install.ps1 docs/install.md --generate-notes
