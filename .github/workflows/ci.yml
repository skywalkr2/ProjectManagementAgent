name: checks

# Every push runs everything: both Pythons and the browser tests (a public repository's runs cost nothing). A newer push
# to the same branch cancels the run it supersedes.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: Self-check
        run: uv run python -m engine.selfcheck

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync
      - run: npm --prefix web ci
      - name: Unit tests
        run: npm --prefix web test
      - name: Build (generates the API types and type-checks)
        run: npm --prefix web run build
      - name: Browser tests with accessibility checks
        run: |
          npx --prefix web playwright install --with-deps chromium
          npm --prefix web run e2e
