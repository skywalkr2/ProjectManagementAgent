name: checks

# Minutes matter (a private repository's plan has a monthly allowance), and every push here has already passed the
# full checks, browser tests included, on the developer's computer (CLAUDE.md). So a push to a working branch runs the
# fast checks on one Python; pull requests, pushes to main and a manual run add the second Python and the browser tests.
# A newer push to the same branch cancels the run it supersedes, and a change to documents alone runs nothing.
on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON((github.event_name == 'push' && github.ref != 'refs/heads/main') && '["3.12"]' || '["3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: Self-check
        run: uv run python -m engine.selfcheck

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync
      - run: npm --prefix web ci
      - name: Unit tests
        run: npm --prefix web test
      - name: Build (generates the API types and type-checks)
        run: npm --prefix web run build
      - name: Browser tests with accessibility checks
        if: github.event_name != 'push' || github.ref == 'refs/heads/main'
        run: |
          npx --prefix web playwright install --with-deps chromium
          npm --prefix web run e2e
