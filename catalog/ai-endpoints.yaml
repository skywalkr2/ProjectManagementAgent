# Kinds of AI account the Add account screen offers, so a person picks a service by name instead of typing addresses.
# Naming public services here (and only here, in data) is a product decision (decisions.md). Each entry:
#   id, name           shown on screen; the name starts the new account's name ("<name> account"), and the id is
#                      its short name in the settings until the person names it themselves
#   adapter            the adapter that talks to it
#   base_url           the base address of its endpoint ("" when the person enters it)
#   key_url            where the person makes a key ("" when it needs none)
#   needs_key          whether a key is asked for
#   local              a server on this computer: nothing leaves it, and the screen can look for it
#   allowed_data       the data levels a new account of this kind is offered by default (the person can change them)
#   settings           provider settings a new account of this kind starts with (see ai.yaml's providers); for a
#                      command-line agent, its whole `agent` block: the command with the program's own options that
#                      turn its tools off, how it takes the packet and where its answer is, and, where the program
#                      can say which account it is signed in as, identity_command with identity_field (or
#                      identity_line and identity_pattern) naming where the account is in its answer
#   program            for a command-line agent: the program's name, so the screen can say whether it is installed
#   model_examples     names the program accepts for its models, offered when it can't list them
#   model_optional     the program picks its own model when none is named
#   note               one line shown with it
# Model ids are never listed here: the screen asks the service for its models with the person's key.
endpoints:
  - id: openai
    name: OpenAI
    adapter: openai-compatible
    base_url: https://api.openai.com/v1
    key_url: https://platform.openai.com/api-keys
    needs_key: true
    note: Pay as you go on your own OpenAI account.
  - id: anthropic
    name: Anthropic
    adapter: openai-compatible
    base_url: https://api.anthropic.com/v1
    key_url: https://console.anthropic.com/settings/keys
    needs_key: true
    settings:
      json_mode: false
    note: Pay as you go on your own Anthropic account.
  - id: google
    name: Google AI Studio
    adapter: openai-compatible
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    key_url: https://aistudio.google.com/apikey
    needs_key: true
    note: Has a free tier with lower limits; check what it allows the service to keep.
  - id: openrouter
    name: OpenRouter
    adapter: openai-compatible
    base_url: https://openrouter.ai/api/v1
    key_url: https://openrouter.ai/settings/keys
    needs_key: true
    note: One key for models from many companies, with prices listed per model.
  - id: mistral
    name: Mistral
    adapter: openai-compatible
    base_url: https://api.mistral.ai/v1
    key_url: https://console.mistral.ai/api-keys
    needs_key: true
    note: Pay as you go on your own Mistral account.
  - id: groq
    name: Groq
    adapter: openai-compatible
    base_url: https://api.groq.com/openai/v1
    key_url: https://console.groq.com/keys
    needs_key: true
    note: Fast answers from open models.
  - id: deepseek
    name: DeepSeek
    adapter: openai-compatible
    base_url: https://api.deepseek.com/v1
    key_url: https://platform.deepseek.com/api_keys
    needs_key: true
    note: Low prices; check where it keeps what you send.
  - id: xai
    name: xAI
    adapter: openai-compatible
    base_url: https://api.x.ai/v1
    key_url: https://console.x.ai
    needs_key: true
    note: Pay as you go on your own xAI account.
  - id: local
    name: Ollama on this computer
    adapter: openai-compatible
    base_url: http://localhost:11434/v1
    needs_key: false
    local: true
    allowed_data: [open, internal, restricted]
    note: Nothing leaves this computer. Start Ollama first.
  - id: lm-studio
    name: LM Studio on this computer
    adapter: openai-compatible
    base_url: http://localhost:1234/v1
    needs_key: false
    local: true
    allowed_data: [open, internal, restricted]
    note: Nothing leaves this computer. Start LM Studio's server first.
  - id: other
    name: Another service that speaks the common chat format
    adapter: openai-compatible
    base_url: ""
    needs_key: false
    note: Enter its address from the service's own documentation. Add a key only if the service asks for one.
  - id: claude-code
    name: Claude Code
    adapter: cli-agent
    base_url: ""
    needs_key: false
    program: claude
    model_examples: [sonnet, opus, haiku]
    settings:
      agent:
        command: [claude, -p, --output-format, json, --model, "{model}", --tools, "", --strict-mcp-config, --no-session-persistence]
        packet_via: stdin
        output_via: stdout
        output_json: true
        output_fields:
          text: result
          input_tokens: usage.input_tokens
          output_tokens: usage.output_tokens
          cached_input_tokens: usage.cache_read_input_tokens
          cost_usd: total_cost_usd
        errors:
          report_on_output: true
          auth: ["not logged in", "please run /login", "invalid api key", "oauth token (has expired|has been revoked)"]
          quota: ["usage limit reached", "hit your limit"]
          rate_limited: ["rate limit", "overloaded"]
        sign_in_hint: Open a terminal, run claude and sign in, then press Test again.
        identity_command: [claude, auth, status]
        identity_field: email
    note: Uses your Claude subscription or account through Claude Code, with its tools turned off.
  - id: copilot
    name: GitHub Copilot CLI
    adapter: cli-agent
    base_url: ""
    needs_key: false
    program: copilot
    model_optional: true
    settings:
      agent:
        command: [copilot, -p, "{prompt}", -s]
        packet_via: argument
        output_via: stdout
        sign_in_hint: Open a terminal, run copilot and sign in with /login, then press Test again.
    note: Uses your Copilot plan through the Copilot CLI; it asks before using tools, so here it can't use them.
  - id: codex
    name: Codex CLI
    adapter: cli-agent
    base_url: ""
    needs_key: false
    program: codex
    model_optional: true
    settings:
      agent:
        command: [codex, exec, --sandbox, read-only, --skip-git-repo-check, --ephemeral]
        packet_via: stdin
        output_via: stdout
        sign_in_hint: Open a terminal, run codex and sign in, then press Test again.
    note: Uses your ChatGPT plan or account through the Codex CLI, in its read-only sandbox.
  - id: gemini-cli
    name: Gemini CLI
    adapter: cli-agent
    base_url: ""
    needs_key: false
    program: gemini
    model_optional: true
    settings:
      agent:
        command: [gemini, --output-format, json]
        packet_via: stdin
        output_via: stdout
        output_json: true
        output_fields:
          text: response
        sign_in_hint: Open a terminal, run gemini and sign in, then press Test again.
    note: Uses your Google account through the Gemini CLI; it asks before using tools, so here it can't use them.
  - id: agent
    name: Another command-line agent signed in as you
    adapter: cli-agent
    base_url: ""
    needs_key: false
    note: Give the command that starts it with its locked-down options; Test also checks the lockdown.
