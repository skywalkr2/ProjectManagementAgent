# The cloud drives the backup step looks for on the person's computer, in the order they are offered (the first one found
# is recommended). Each entry: the drive's name as the screen shows it, and where its folder lives on each system, as
# places inside the person's home folder (a `*` matches any characters in one name, for drives that put an account in the
# folder's name). A system with no place is skipped. The workspace's own list (`storage.backups.cloud_folders`) replaces
# this one.
folders:
  - name: iCloud Drive
    macos: ["Library/Mobile Documents/com~apple~CloudDocs"]
    windows: ["iCloudDrive"]
    linux: []
  - name: OneDrive
    macos: ["Library/CloudStorage/OneDrive*", "OneDrive"]
    windows: ["OneDrive", "OneDrive - *"]
    linux: ["OneDrive"]
  - name: Dropbox
    macos: ["Dropbox", "Library/CloudStorage/Dropbox"]
    windows: ["Dropbox"]
    linux: ["Dropbox"]
  - name: Google Drive
    macos: ["Library/CloudStorage/GoogleDrive-*/My Drive", "Google Drive"]
    windows: ["Google Drive", "My Drive"]
    linux: ["Google Drive"]
