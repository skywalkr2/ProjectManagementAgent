# Signs that a message was sent automatically, read by `engine/automatic_mail.py`. The standard headers
# (Auto-Submitted, Precedence, List-Id and delivery reports) are handled in code; this file lists the mail programs'
# own compatibility headers and the subject phrases their automatic replies use. Header names match without regard to
# case. Sources by name: RFC 3834 (automatic responses), RFC 3464 and RFC 6533 (delivery reports), RFC 2919 (List-Id).

# A header from this list with one of the affirmative values marks an automatic reply.
reply_headers:
  - x-autoreply
  - x-auto-reply
  - x-autorespond
  - x-autoresponse
  - x-auto-response
  - x-ms-exchange-organization-autoreply
affirmative: ["yes", "true", "1", "auto-replied", "auto-reply", "autoreply", "vacation", "oof"]

# A header from this list holding a bare address marks an automatic reply.
reply_from_headers:
  - x-autoreply-from

# A header here with one of its listed values marks an automatic reply.
generated_reply_headers:
  x-autogenerated: ["reply", "auto-reply", "auto-replied"]

# Subject phrases (regular expressions, matched without regard to case) that mark an automatic reply only when one
# starts the subject and is the whole subject or is followed by a colon. "I'll be out of office Friday" is not one.
subject_phrases:
  - "automatic reply"
  - "auto(?:matic)?[- ]response"
  - "auto[- ]reply"
  - "out[- ]of[- ]office"
  - "réponse automatique"
  - "réponse d['’]absence"
  - "absence du bureau"
  - "automatische antwort"
  - "abwesenheitsnotiz"
  - "abwesenheitsmeldung"
  - "respuesta automática"
  - "fuera de la oficina"
  - "risposta automatica"
  - "fuori sede"
  - "resposta automática"
  - "fora do escritório"
  - "automatisch antwoord"
  - "afwezigheidsbericht"
  - "automatiskt svar"
  - "frånvaromeddelande"
  - "automatisk svar"
  - "fraværsmelding"
  - "automaattinen vastaus"
  - "poissaolovastaus"
  - "自動返信"
  - "自動応答"
  - "不在通知"
  - "自动回复"
  - "自動回覆"
