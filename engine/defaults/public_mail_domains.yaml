# Public mail domains: the free mail services that anyone can have an address at. A sorting rule for the whole domain
# would reach every contact with a personal address there, so the app never offers one for these. A domain matches only
# when it is listed exactly (case does not matter); a regional or older name of a service is listed on its own. The
# person adds more in the settings (`watch.public_mail_domains_extra`); this list is the shipped part.
