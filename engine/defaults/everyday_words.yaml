# Everyday words: common English words (nouns, verbs, adjectives, days and months of the week, and the small words of a
# sentence) that a person might also use as the whole name of a project. A project whose name is one of these alone
# ("Launch", "Home", "Budget") never files an item by that name: it would match almost any message. The same word
# works as an alias the person gives, or as part of a longer name. The list was written for the core, by hand, from
# the kinds of words that name projects and chores; it is not taken from any outside list. Words are lower case and
# whole words; case is ignored when read. It is the default of the setting `language.everyday_words`, which a
# workspace can extend or replace. One list for each language, named by its primary language tag.
