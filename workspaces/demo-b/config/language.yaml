version: 1
blocked_phrases: [confirm, check whether, check if, "TBD?"]
run_on_separators: [" / ", "; "]
never_shown: []
# The words that mean the person themselves.
self_words: [me, myself, I]
# Lines an item's title is never taken from: greetings, quoted headers, sign-offs.
title_skip: ['(hi|hello|hey|dear|good (morning|afternoon|evening))\b', '(from|to|cc|sent|date|subject)\s*:', '(thanks|best|regards|cheers)\b[ ,!.]*$', '-{2,}|>']
# Notes under this many words with no link are bare confirmations and stay with the change.
bare_confirmation_words: 4
reported_speech:
  verbs: [said, says, confirmed, confirms, told, wrote, writes, asked, wants]
  own_speakers: [I, we]
  quote_min_words: 3
messages:
  greeting: "Hi {first_name},"
  actions_heading: "Action items with you:"
  closing: "Thanks so much!"
  date_format: "%a, %b %d"
  date_time_format: "%a, %b %d, %Y, %I:%M %p"
