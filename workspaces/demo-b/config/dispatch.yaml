version: 1
max_input_chars: 40000
fix_rounds: 1
retries: 2
retry_wait_seconds: 30
offline_check_seconds: 60
offline_line_after_minutes: 60
cleaning:
  remove_quoted: true
  signature_markers: ["-- ", "Sent from my ", "Best regards,"]
  remove_patterns: ["(?is)^(confidentiality notice|this e-?mail and any attachments).*"]
