version: 1
max_input_chars: 40000
fix_rounds: 1
retries: 2
retry_wait_seconds: 30
offline_check_seconds: 60
offline_line_after_minutes: 60
cleaning:
  remove_quoted: true
  signature_markers: ["-- ", "Sent from my ", "Best regards,"]
  remove_patterns: ["(?is)^(confidentiality notice|this e-?mail and any attachments).*"]
knowledge:
  glossary_all_below: 150
  facts_budget: 4000
  stable_budget: 8000
  search_rounds: 2
  search_results: 20
  refusals_to_packet:
    share: 0.05
    of_last: 50
    min_runs: 10
  rule_review_days: 30
  rule_review_every_days: 7
