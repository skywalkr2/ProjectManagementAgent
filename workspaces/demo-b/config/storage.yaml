version: 1
backend: sqlite
export:
  every_minutes: 30
  commit: true
backups:
  targets:
    - path: ~/CloudDrive/lantern-backups
      label: cloud folder
  every_hours: 12
  keep: 30
  automatic: true
  retry_minutes: 30
files:
  max_file_mb: 50
  max_total_mb: 2000
sync:
  folder: ""   # e.g. ~/CloudDrive/cockpit; off until set
  watch_outside_edits: true
  shared: false
  lease_stale_after_minutes: 10
