# Places the assistant keeps reading. Each source names a connector and that connector's settings.
version: 1
sources:
  - id: inbox
    connector: folder
    label: Inbox folder
    every_minutes: 30
    first_run: baseline   # the first read only notes what is there
    report_removed: false
    settings:
      path: inbox         # inside the workspace's folder; a full path works too
      patterns: ["*.txt", "*.md"]
  - id: news
    connector: feed
    label: Harbor news
    enabled: false        # turn on to read the feed every few hours
    every_minutes: 240
    settings:
      url: https://news.example.com/feed.xml
  - id: calendar
    connector: calendar
    label: Work calendar
    enabled: false        # turn on once the calendar's private address is set
    every_minutes: 60
    settings:
      address: env:WORK_CALENDAR_ADDRESS   # the private address, kept outside the files
      days_ahead: 30
  - id: mail
    connector: mailbox
    label: Project mail
    enabled: false        # turn on once an app password is set
    every_minutes: 15
    settings:
      host: mail.example.com
      user: pm@example.com
      password: env:PROJECT_MAIL_PASSWORD
      folder: Projects
failures_before_asking: 3
triage:
  - name: Spacing only
    kind: cosmetic
    why: "Closed: {reason}."
  - name: Scratch files
    kind: name-matches
    params: {patterns: ["*.tmp", "~*"]}
