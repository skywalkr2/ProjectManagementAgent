# Places the assistant keeps reading. Each source names a connector and that connector's settings.
version: 1
sources:
  - id: inbox
    connector: folder
    label: Inbox folder
    author: PER-1         # everything in it is the person's own work; a team id works too
    every_minutes: 30
    first_run: baseline   # the first read only notes what is there
    report_removed: false
    data_level: internal  # this source's own level; left out, the kind's level or the default applies
    settings:
      path: inbox         # inside the workspace's folder; a full path works too
      patterns: ["*.txt", "*.md"]
  - id: news
    connector: feed
    label: Harbor news
    enabled: false        # turn on to read the feed every few hours
    every_minutes: 240
    settings:
      url: https://news.example.com/feed.xml
  - id: calendar
    connector: calendar
    label: Work calendar
    enabled: false        # turn on once the calendar's private address is set
    every_minutes: 60
    first_run: recent     # the first read hands in what happens within a day of now; the rest is only noted
    first_run_hours: 24
    settings:
      address: env:WORK_CALENDAR_ADDRESS   # the private address, kept outside the files
      days_ahead: 30
  - id: mail
    connector: mailbox
    label: Project mail
    enabled: false        # turn on once an app password is set
    every_minutes: 15
    first_run: intake     # the first read takes in the last first_run_days of mail quietly: one list to look over
    first_run_days: 14    # older mail isn't read; Today says "Not looked at before <date>"
    settings:
      host: mail.example.com
      user: pm@example.com
      password: env:PROJECT_MAIL_PASSWORD
      folder: Projects
look_back_choices: [30, 90, 365]   # days a mail source can be asked to look further back, shown as a list
failures_before_asking: 3
unread_gap_factor: 2   # a failing source becomes a line on Today after this many of its own read intervals
default_data_level: internal   # how sensitive a watched source's items are when nothing else says
connector_data_levels: {mailbox: restricted}   # per kind of source; a source's own data_level wins over this
set_aside_defaults: true   # mailing lists and promotions are set aside with no AI run
sorting: ai   # a low-cost run sorts the mail the rules cannot place, from sender, subject and category only
sorting_batch: 25   # messages covered by one sorting run
set_aside_keep_seconds: 60   # how long a confirmed message's copy is kept so Undo can bring it back
public_mail_domains_extra: [mail.example.net]   # more free mail domains, so no rule is offered for the whole domain
triage:
  - name: Spacing only
    kind: cosmetic
    why: "Closed: {reason}."
  - name: Scratch files
    kind: name-matches
    params: {patterns: ["*.tmp", "~*"]}
