  - renew
  "on": '2027-03-03'
  on_kind: renewal
- held: record.set
  text_has:
  - remind_at
forbid:
- op: action.close
stub_answer:
  summary: The studio membership renews on March 3, 2027.
  ops:
  - op: fact
    text: The studio membership renews on March 3, 2027
    "on": '2027-03-03'
    on_kind: renewal
    evidence:
