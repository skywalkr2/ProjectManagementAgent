id: discarded
title: A proposal the person discarded does not come back from the next input that mentions it
skills: [use-lesson, no-repeat-question]
negative: true
first:
  received: '2026-10-09'
  project: PRJ-1
  pasted: |-
    From: Theo Brandt

    Not me, ask Ines Duarte. She owns the advance-copy reviewer list and I only hear about it afterwards.
  expect_proposal:
  - op: routing.add
    topic_has: [reviewer]
    person: PER-5
  - op: routing.add
    topic_has: [reviewer]
    person: PER-3
    negative: true
  keep: discard
later:
  received: '2026-10-14'
  project: PRJ-1
  pasted: |-
    From: Theo Brandt

    Not me, ask Ines Duarte. She owns the advance-copy reviewer list. The cover finish is soft-touch.
  # The mail answers the open question about the cover finish, so it closes that question.
  expect:
  - op: question.done
    id: Q-2
  # The repeated proposal is saved as a discarded entry nobody sees, so the op still counts as applied.
  allow: [routing.add, fact]
  expect_proposal: none
  packet_lacks: [Who answers what]
ideal:
