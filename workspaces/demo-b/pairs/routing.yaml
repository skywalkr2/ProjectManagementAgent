id: routing
title: A reply that says who answers is kept, and the next question on that topic goes to that person
skills: [follow-routing, use-lesson]
first:
  received: '2026-10-09'
  project: PRJ-1
  pasted: |-
    From: Theo Brandt

    Not me, ask Ines Duarte. She owns the advance-copy reviewer list and I only hear about it afterwards.
  expect_proposal:
  - op: routing.add
    topic_has: [reviewer]
    person: PER-5
    origin: input
  - op: routing.add
    topic_has: [reviewer]
    person: PER-3
    negative: true
    origin: input
  keep: true
later:
  received: '2026-10-21'
  project: PRJ-1
  pasted: |-
    From: Maya Lindqvist

    Which reviewers are getting advance copies? We want to avoid sending the same people a second copy.
  expect:
  - op: question.add
    to: PER-5
    kind: question
  forbid:
  - op: question.add
    to: PER-3
  allow: [action.add]  # the PM's reply to the shop, which the notes prompt asks for beside the question to Ines
  packet_has: [Who answers what, reviewer list]
ideal:
  first:
    summary: Theo passed the reviewer list on to Ines.
    topic: the advance-copy reviewer list
    ops:
    - op: routing.add
      text: Questions about the advance-copy reviewer list go to Ines Duarte.
      topic: advance-copy reviewer list
      person: PER-5
      applies_to: {scope: projects, projects: [PRJ-1]}
      evidence:
        quote: Not me, ask Ines Duarte. She owns the advance-copy reviewer list
    - op: routing.add
      text: Theo Brandt does not answer questions about the advance-copy reviewer list.
      topic: advance-copy reviewer list
      person: PER-3
      negative: true
      applies_to: {scope: projects, projects: [PRJ-1]}
      evidence:
        quote: I only hear about it afterwards
  later:
    summary: Asked Ines which reviewers are getting advance copies.
    topic: advance copies
    ops:
    - op: question.add
      to: PER-5
      kind: question
      title: Which reviewers are getting advance copies?
      text: The bookshop wants to avoid sending anyone a second copy.
      links:
      - label: Book page
        url: https://books.example.org/salt-orchard
      matters_for: The date the advance copies go out
      project: PRJ-1
