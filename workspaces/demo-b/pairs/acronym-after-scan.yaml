id: acronym-after-scan
# Pending: the scan for new terms proposes "HLP: not known yet" while the first input is read, and the learned meaning
# merges into that proposal as a duplicate, so Keep keeps "not known yet" and the correction is lost. The pair passes
# once a learned meaning replaces an unknown one it duplicates.
pending: A learned meaning merges into the scan's "not known yet" proposal for the same term and is lost.
title: An unknown term is read the wrong way, corrected once, and read right the next time
first:
  received: '2026-10-08'
  project: PRJ-1
  pasted: |-
    From: Sam Rivera

    The HLP is back from Harrowgate. Please approve it by the 15th.
  wrong:
    summary: Sam asks for the lamination plan to be approved.
    ops:
    - op: action.add
      text: Approve the hardcover lamination plan
      owners: [Avery Lane]
      due: '2026-10-15'
      project: PRJ-1
      evidence:
        quote: Please approve it by the 15th
  correction:
    kind: sent_back
    note: HLP is the Harrowgate layout proof, not a lamination plan.
  expect_proposal:
  - op: glossary.add
    term: HLP
    text_has: [layout proof]
  keep: true
later:
  received: '2026-10-20'
  project: PRJ-1
  pasted: |-
    From: Sam Rivera

    The HLP for the paperback is ready. Please approve it by the 24th.
  expect:
  - op: action.add
    text_has: [layout proof]
    owners: [PER-1]
    due: '2026-10-24'
  packet_has: [Harrowgate layout proof]
ideal:
  learn:
    summary: HLP means the Harrowgate layout proof.
    topic: the HLP term
    ops:
    - op: glossary.add
      text: 'HLP: the Harrowgate layout proof'
      term: HLP
      meaning: the Harrowgate layout proof
      confidence: confirmed
      evidence:
        quote: HLP is the Harrowgate layout proof
  later:
    summary: Approve the layout proof by the 24th.
    ops:
    - op: action.add
      text: Approve the Harrowgate layout proof for the paperback
      owners: [Avery Lane]
      due: '2026-10-24'
      project: PRJ-1
      evidence:
        quote: Please approve it by the 24th
