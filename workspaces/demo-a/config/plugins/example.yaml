# Settings format version.
version: 1
# File a question for the PM when a reminder is added.
ask_on_add: true
# Title of the question filed for the PM.
question: Review the new reminder?
# Default wording for reminder stages; stages.yaml can replace the whole list.
draft_label: Recorded
ready_label: Ready for review
# Explanations returned by the deterministic entry check.
check_pass: The reminder has text.
check_fail: Add text to the reminder first.
# Wording for the action that makes a note from a text file.
note_action_label: Make a note from this file
note_summary: Make a note from {name}
note_count_label: Include the word count
note_count_text: ({n} words)
note_not_text: Only plain text files can be turned into a note.
note_empty: That file has no text to make a note from.
kinds_label: Reminder kind
kinds: [Call, Email, Site visit]   # the first values of the reminder kind list
