version: 1
lints: {blocked-wording: return, run-on-list: return, near-duplicate-action: warn, evidence-fit: return, already-known: return, near-duplicate-question: warn}
projects: {}   # per project, e.g. {PRJ-2: {plugin/lint-name: off}}: a check switched off for one piece of work
tuning:
  near_duplicate_action: {similarity: 0.8}   # how alike a new action must be to an open or done one to be flagged (0 to 1)
  near_duplicate_question: {similarity: 0.8, days: 30}   # how alike a new question must be to an open or recently answered one, and how many days back (0 to 1)
  already_known: {similarity: 0.7}   # how much of a question's subject a recorded fact must hold to count as answering it (0 to 1)
