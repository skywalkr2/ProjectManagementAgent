version: 1
lints: {blocked-wording: return, run-on-list: return, near-duplicate-action: warn, evidence-fit: return, already-known: return, near-duplicate-question: warn, several-questions: return, question-without-stake: return, unnamed-recipient: return, unverified-quote: return, unverified-name: warn, unknown-link: return, version-number: return, summary-is-status: return, unlinked-made: return, watched-project: return, other-team-item: return, stance: return, rejected-ask: return, bookkeeping: return, long-quote: return, action-stands-alone: return, reasoning-in-title: return, question-is-statement: return, thread-promise-unanswered: return, own-request-not-promise: return, own-promise-missed: return, team-we-one-owner: return, promise-as-fact: return, someone-given-owner: return, due-move-missed: return, owed-to-missing: return, project-start-as-fact: return}
projects: {}   # per project, e.g. {PRJ-2: {plugin/lint-name: off}}: a check switched off for one piece of work
tuning:
  near_duplicate_action: {similarity: 0.8, date_window_days: 3}   # how alike a new action must be to be flagged (0 to 1); how many days apart two dates for one promise may be
  near_duplicate_question: {similarity: 0.8, days: 14}   # how alike a new question must be to an open or recently answered one to the same person (0 to 1), and how many days back
  near_duplicate_meeting: {similarity: 0.8, minutes: 30}   # how alike a meeting added in one line must be to one already on the calendar (0 to 1), and how many minutes apart their starts may be
  already_known: {similarity: 0.7}   # how much of a question's subject a recorded fact must hold to count as answering it (0 to 1)
  several_questions: {minimum: 2}   # how many numbered questions in one question's text make it several
  unverified_quote: {min_words: 3}   # how many words a passage in quotation marks needs to count as a quote that must be in the material cited
  owner_suggestion: {match: 0.5}   # how much of a routing entry's topic an unowned action must hold for the entry to suggest its owner (0 to 1)
  long_quote: {max_words: 25}   # the most words quoted back in text written for someone else
  action_stands_alone: {min_words: 2}   # the fewest words an action may have to be read on its own
