# Fictional workplace PM workspace (fixture). Every name here is invented.
version: 1
name: Tallowmere Freight PMO
assistant_name: Shippy
user:
  person: PER-1
  accounts: [PM account]   # names the person edits under on watched sources, kept apart from our_accounts
  timezone: America/Chicago
owner_format: "{team} ({full_name})"
language: en-US
# The kinds of contact detail a person's record can hold.
contact_kinds: [email, phone, address]
project:
  summary_max_lines: 3   # the most lines a project's summary may have; what was found goes to facts
plugins:
  enabled: [example, kit]
  actions:
    keep_minutes: 60
    preview_mb: 5
    max_previews: 20
    max_items: 2000
    max_requests: 100
  tools:
    timeout_seconds: 120
    max_timeout_seconds: 1800
    probe_timeout_seconds: 10
    output_kb: 512
    collect_file_mb: 25
    collect_total_mb: 100
  jobs: {}   # e.g. {example/tidy: {every_minutes: 120}}
  failures_before_off: 3   # a plugin call may fail this many times in a row before the plugin is turned off
  catalog: {enabled: true, shipped_feed: true, feeds: [], refresh_hours: 24, release_tokens: {}}   # where Add-ons finds packs
  secrets: {}   # e.g. {mail-plugin: {token: env:MAIL_TOKEN}}: references only, never the secret
our_accounts: [Cockpit assistant]   # names this app publishes under on watched sources
demo: true   # made-up example data: the screens say so
