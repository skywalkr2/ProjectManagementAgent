version: 1
chase_undated_days: 14   # a waiting-on with no date gets a line after this many days with no news
chase_dated_days: 7   # a dated waiting-on gets a line from this many days before its date
second_move_days: 14   # a second move of the same date within this many days shows in your own history as moved again
default_stance: alongside   # who a new person is to you until you say otherwise
tracks: [dates, decisions]   # what you track: no question is drafted about anything else
reply_thread_days: 14   # same subject and someone in common within this many days is one conversation, for a sent reply to end a reply you owe
sent_match:
  window_days: 5   # a sent message matches a copied one only when it went to the same person within this many days
  similarity: 0.6   # how much of their words a sent message and a copied one share for them to be the same message
  ask_after_days: 2   # a copied message no sent message matches gets a "did it go out?" line after this many days
hold_outside_hours: false   # on, what the assistant adds on its own waits for working hours and arrives together; off here so the sandbox shows lines at any time of day
reminders:
  working_start: "09:00"   # the working day starts; what the assistant adds on its own that came in earlier waits until then
  working_end: "17:30"   # the working day ends; what the assistant adds on its own that came in later waits for the next working day
  working_first_day: monday   # the first working day of the week
  working_last_day: friday   # the last working day of the week
  quiet_start: "21:00"   # quiet hours start; reminders in them wait and arrive together afterwards
  quiet_end: "07:00"   # quiet hours end, which may be the next morning
  missed: each   # reminders missed while the computer slept: each (one line each) or summary (one line)
  later_today_hours: 3   # hours from now that Later today snoozes to
  evening: "18:00"   # the time This evening snoozes to
  late_after_minutes: 5   # how long after its time a reminder not yet shown is marked late
  where: nowhere   # where a reminder reaches you when the app isn't open: nowhere, app (the app's own calendar), calendar or mail (an account)
  where_account: ""   # the account those reminders go through, one the assistant may act on
  look_ahead_hours: 24   # a reminder coming due within this many hours is drafted ahead, so it can reach you while the computer sleeps
  allowed_data: internal   # the most sensitive to-do whose own words a reminder may carry out; above it only the time goes
