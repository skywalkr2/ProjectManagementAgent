version: 1
backend: sqlite
export:
  every_minutes: 60
  commit: true
backups:
  targets:
    - path: /Volumes/Backup/cockpit
      label: external drive
  every_hours: 24
  keep: 14
  automatic: true
  retry_minutes: 60
files:
  max_file_mb: 50
  max_total_mb: 2000
sync:
  folder: ""   # e.g. ~/CloudDrive/cockpit; off until set
