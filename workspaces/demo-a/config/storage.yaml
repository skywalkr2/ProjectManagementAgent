version: 1
backend: sqlite
export:
  every_minutes: 60
  commit: true
backups:
  targets:
    - path: /Volumes/Backup/cockpit
      label: external drive
  cloud_folders:    # the cloud drives the setup guide offers, found by where each keeps its folder
    - name: Example Drive
      macos: ["ExampleDrive"]
      windows: ["ExampleDrive"]
      linux: ["ExampleDrive"]
  cloud_path: [Backups, PM Cockpit]
  every_hours: 24
  keep: 14
  automatic: true
  retry_minutes: 60
  encrypt: ""   # e.g. file:~/keys/backup.key; empty: backups are not encrypted
files:
  max_file_mb: 50
  max_total_mb: 2000
  read_max_mb: 25
  read_max_chars: 30000
sync:
  folder: ""   # e.g. ~/CloudDrive/cockpit; off until set
  watch_outside_edits: true
  shared: false
  lease_stale_after_minutes: 10
kept_secrets:
  keep_days: 30
  undo_grace_minutes: 10
