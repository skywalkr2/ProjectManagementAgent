version: 1
wording: {}   # overrides for the wording sheet by key; plugins name their own kinds
shortcuts: {next: j, previous: k, primary: a, send_back: s, copy: c, edit: e, move: m, undo: u, hand_in: n, help: "?", ask: /, next_pane: "]", previous_pane: "[", show_new: "N"}
narrow_below_px: 700   # below this width: the phone layout, with a bottom bar
toast_seconds: 0
links: [{name: Planning board, address: "https://planning-board.example.com/spring"}, {name: Shared schedule, address: "https://shared-schedule.example.com/team"}]   # links to your own pages, shown in the header
feedback_to: feedback@example.com   # where the feedback button writes
today: {mail_hours: 48, mail_max: 40, agenda_days_ahead: 2, stale_after_days: 21, top_priorities_lines: 5, top_priorities_ahead_days: 14}   # what Today's agenda and what came in cover
followups: {action_due_within_days: 7, undated_after_days: 14, question_after_days: 4, second_nudge_items: 2, escalate_after_chases: 2}   # when a sent item is due a follow-up
walkthrough: {first_promises: 5}   # how many promises the walkthrough's first-result screen shows
series: {usually_with_share: 0.5, usually_with_min_meetings: 2, usually_with_max: 6}   # who a series is "usually with" on its page
brand: {color: "#2f6f5e", logo: null}   # the accent color; a logo is an image file in this config folder
notifications: {enabled: false, browser: true, webhook: null, webhook_format: json, quiet_hours: {start: "22:00", end: "06:30"}, retry_minutes: 15, message_one: "1 decision waiting for you", message_many: "{count} decisions waiting for you", test_message: "This is a test. You will get a note like this when something needs you."}   # notices that something needs you: off until turned on, to you only, a count and never what an item is about
theme: system   # system, light or dark; each person can change it on their own device
density: compact   # comfortable or compact
