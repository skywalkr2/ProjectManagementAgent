version: 1
wording: {}   # overrides for the wording sheet by key; plugins name their own kinds
shortcuts: {next: j, previous: k, primary: a, send_back: s, copy: c, edit: e, undo: u, hand_in: n, help: "?", ask: /, next_pane: "]", previous_pane: "[", show_new: "N"}
narrow_below_px: 700   # below this width: the phone layout, with a bottom bar
toast_seconds: 0
feedback_to: feedback@example.com   # where the feedback button writes
today: {mail_hours: 48, mail_max: 40, agenda_days_ahead: 2}   # what Today's agenda and what came in cover
followups: {action_due_within_days: 7, undated_after_days: 14, question_after_days: 4, second_nudge_items: 2}   # when a sent item is due a follow-up
brand: {color: "#2f6f5e", logo: null}   # the accent color; a logo is an image file in this config folder
theme: system   # system, light or dark; each person can change it on their own device
density: compact   # comfortable or compact
