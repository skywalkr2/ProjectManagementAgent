id: a-moved-date-sent-back-leaves-no-calendar-entry
title: A calendar entry made for an action's own new date, sent back, is undone, the work is queued again with the note, and a lesson is proposed
skills: [dates, use-lesson]
received: '2026-10-14'
setup:
- received: '2026-10-14'
  project: PRJ-1
  pasted: |-
    From: Tobias Wren

    The cut-over runbook will be published on the 24th instead of the 20th.
  answer:
    summary: The runbook is now due on the 24th, as a calendar entry.
    ops:
    - op: event.add
      title: Cut-over runbook published
      start: '2026-10-24'
      project: PRJ-1
      evidence:
        quote: The cut-over runbook will be published on the 24th instead of the 20th
action:
  kind: sent_back
  note: The 24th is only the runbook's new due date. Change the action's due date and make no calendar entry.
expect_learning: true
expect_signals: [sent_back]
expect_records:
- kind: request
  where: {state: queued, task: notes}
  text_has: [Sent back by the PM, new due date]
  count: 1
- kind: lesson
  where: {status: proposed}
  text_has: [due date]
- kind: action
  id: ACT-1
  where: {due: '2026-10-20'}
forbid_records:
- kind: event
  text_has: [runbook]
ideal:
  learn:
    summary: A new date for an open action changes its due date.
    topic: a new date for an open action
    ops:
    - op: lesson.add
      text: A new date for an open action is that action's new due date, never a calendar entry.
      guard: When an input gives a new date for an action that is open, change the action's due date and add no calendar entry.
      evidence:
        quote: The 24th is only the runbook's new due date
