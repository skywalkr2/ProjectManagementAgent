id: moving-an-entry-asks-about-the-actions-tied-to-it
title: Moving a calendar entry makes one follow-on run that asks the action's owner whether its date should change, and changes nothing, with Undo
skills: [dates]
received: '2026-10-14'
given:
- {kind: event, id: EVT-90, fields: {title: Cut-over runbook review, start: '2026-10-22', project: PRJ-1, trust: trusted}}
- {kind: action, id: ACT-90, fields: {text: Share comments on the cut-over runbook, owners: [{person: PER-3}], project: PRJ-1, event: EVT-90, due: '2026-10-22'}}
action:
  kind: changed
  id: EVT-90
  fields: {start: '2026-10-24'}
expect_learning: false
expect_follow_on: true
expect_undo: true
expect_records:
- kind: question
  where: {to: PER-3, kind: decision, status: open, matters_for: ACT-90}
