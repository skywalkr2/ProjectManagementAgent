id: not-a-project
title: Words taken for a new project are set aside as not a project, and the next mention proposes nothing
skills: [use-lesson]
first:
  received: '2026-10-09'
  pasted: |-
    From: Odile Fenwick

    We are starting the Depot Scanner Pilot next month. Odile will draft the pilot plan by the 30th.
  wrong:
    summary: A plan for a pilot that isn't a project here yet; the project is proposed.
    ops:
    - op: action.add
      text: Draft the pilot plan
      owners: [Odile Fenwick]
      due: '2026-10-30'
      evidence:
        quote: Odile will draft the pilot plan by the 30th
    - op: project.add
      name: Depot Scanner Pilot
      evidence:
        quote: starting the Depot Scanner Pilot next month
  correction:
    kind: not_a_project
  # The button's own entry is the person's words, so it is active at once and nothing waits for Keep.
  allow_active: true
  expect_proposal:
  - op: glossary.add
    term: Depot Scanner Pilot
    status: active
    origin: person
    text_has: [not a project]
later:
  allow: [fact]  # a fact of what the mail states
  received: '2026-10-20'
  pasted: |-
    From: Odile Fenwick

    The Depot Scanner Pilot demo is next week. Odile will book the room by the 25th.
  expect:
  - op: action.add
    text_has: [book the room]
    owners: [PER-2]
    due: '2026-10-25'
  forbid:
  - op: project.add
  - op: event.add
  packet_has: ["Depot Scanner Pilot: Not a project."]
ideal:
  learn:
    summary: Nothing to generalize.
    topic: a name that is not a project
    ops: []
  later:
    summary: Odile books the room by the 25th.
    topic: pilot demo room
    ops:
    - op: action.add
      text: Book the room for the pilot demo
      owners: [Odile Fenwick]
      due: '2026-10-25'
      evidence:
        quote: Odile will book the room by the 25th
