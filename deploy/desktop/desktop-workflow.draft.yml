name: Desktop test builds

"on":
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12.15'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PYTHONHASHSEED: '0'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            python_arch: arm64
            spec: build_support/cockpit_macos.spec
          - target: macos-x86_64
            runner: macos-15-intel
            python_arch: x64
            spec: build_support/cockpit_macos.spec
          - target: windows-x64
            runner: windows-2022
            python_arch: x64
            spec: build_support/cockpit_windows.spec
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the pinned interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python_arch }}
          pip-version: '25.2'

      - name: Require the locked dependencies and built screens
        shell: bash
        env:
          LOCK_FILE: build_support/locks/${{ matrix.target }}.txt
        run: |
          test -s "$LOCK_FILE" || { echo "Commit the platform dependency lock described in README.md"; exit 1; }
          test -f web/dist/index.html || { echo "Commit or restore the prebuilt web/dist screens before tagging"; exit 1; }
          python -m pip install --require-hashes -r "$LOCK_FILE"
          python -m pip install --no-deps --no-build-isolation .
          python -m pip check
          python -c "import PyInstaller; assert PyInstaller.__version__ == '6.22.3'"

      - name: Read and validate the release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python build_support/release_tools.py prepare

      - name: Freeze the application
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.0'
        run: python -m PyInstaller --noconfirm --clean ${{ matrix.spec }}

      - name: Create the disk image
        if: runner.os == 'macOS'
        run: python build_support/release_tools.py dmg

      - name: Install the pinned installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tool = (Get-Content build_support/tool_downloads.yaml -Raw | ConvertFrom-Json).inno_setup
          $setup = Join-Path $env:RUNNER_TEMP "inno-setup.exe"
          Invoke-WebRequest -Uri $tool.url -OutFile $setup
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $tool.sha256) { throw "Installer compiler checksum mismatch" }
          $compilerDir = Join-Path $env:RUNNER_TEMP "inno-$($tool.version)"
          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$compilerDir`""
          )
          if ($process.ExitCode -ne 0) { throw "Compiler setup failed: $($process.ExitCode)" }
          $compiler = Join-Path $compilerDir 'ISCC.exe'
          if (-not (Test-Path $compiler)) { throw "Compiler not found" }
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile the per-user installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:INNO_COMPILER "/DAppVersion=$env:APP_VERSION" "/DWindowsVersion=$env:WINDOWS_VERSION" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\dist\Thimbleby" "/DOutputDir=$env:GITHUB_WORKSPACE\dist" `
            build_support/windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }

      - name: Write installer checksums
        run: python build_support/release_tools.py hashes

      - name: Upload the installer and checksums
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Thimbleby-${{ env.APP_VERSION }}-${{ matrix.target }}-unsigned
          path: |
            dist/*.dmg
            dist/*-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
