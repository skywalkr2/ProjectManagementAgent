# A packs catalog feed: the file the Add-ons screen reads (design 3.11). Publish your own copy at an https address
# (for example as a file in a public repository), then set the repository variable PACK_CATALOG to that address so
# release builds list it. Everything here is shown to people as plain text; the app writes what a pack adds, reaches
# and keeps from `provides` and `requires`, so copy those from the pack's plugin.yaml exactly.
# Every name below is invented.
version: 1
packs:
  - id: bindery                       # the pack's plugin name
    name: Bindery pack
    summary: Takes a finished manuscript to a printable book and an ebook.
    publisher: Quillwork Tools
    maintainers: true                 # made by the app's maintainers (false for a third party)
    updated: "2030-03-01"
    version: 1.2.0
    plugin_api: ">=0.3,<0.4"          # as in its plugin.yaml
    price:
      model: subscription             # free, one_time, subscription or see_publisher
      amount: 9
      currency: USD
      period: month                   # month or year, for a subscription
      note: Free for your first book
    homepage: https://packs.example.com/bindery
    install: uv tool install --with bindery-pack pm-cockpit
    demo: true                        # it ships made-up data for `cockpit demo --plugin bindery`
    ai_jobs:                          # its typical AI work, so the app can price it on each person's accounts
      - {label: Drafting a chapter, input_tokens: 6000, output_tokens: 4000}
      - {label: A full edit pass, input_tokens: 90000, output_tokens: 30000, role: check, data_level: restricted}
    provides:
      record_types: [bindery/book, bindery/chapter]
      panels: [bindery/books]
      today: [bindery/next-steps]
      ai_task_kinds: [bindery/draft, bindery/edit]
    requires:
      network: []
      secrets: []
      data_levels: [open, internal, restricted]
      tools: [{name: ebook-checker, version_command: ebook-checker --version}]
