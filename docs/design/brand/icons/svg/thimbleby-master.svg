    </linearGradient>
    <pattern id="dimple-pattern" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="11" fill="#B59859"/><circle cx="54" cy="54" r="11" fill="#B59859"/>
