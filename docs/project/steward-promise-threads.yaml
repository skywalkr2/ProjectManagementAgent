# Fictional promise threads for the daily steward (design 6.32, phase S2); all addresses use example.com.
# Drafted with an outside assistant and checked by tests/test_steward_threads.py.
# Message and promise ids are local to each thread. Due phrases stay verbatim.
# A non_answer does not close a promise. Partial keeps its undelivered remainder open.
# condition_met activates a conditional promise without fulfilling it; condition_state on an expected open promise
# is met or not_met. Quoted history and signature text never create duplicate promises.
# Bodies mention attachments as fictional evidence; no attachment files are supplied.
- id: t01
  subject: Alderline proposal
  messages:
  - id: m1
    from: rowan@example.com
    to: mira@example.com
    body: "Mira, I'll send the Alderline proposal by Friday at noon.\n\n-- \nRowan"
  - id: m2
    from: mira@example.com
    to: rowan@example.com
    body: "Perfect; the budget section is the bit we need most.\n\n-- \nMira\n\nRowan <rowan@example.com> wrote:\n> Mira,\
      \ I'll send the Alderline proposal by Friday at noon.\n> \n> -- \n> Rowan"
  - id: m3
    from: rowan@example.com
    to: mira@example.com
    body: "The proposal is attached, including the budget section. Thanks for waiting.\n\n-- \nRowan\n\nMira <mira@example.com>\
      \ wrote:\n> Perfect; the budget section is the bit we need most.\n> \n> -- \n> Mira\n> \n> Rowan <rowan@example.com>\
      \ wrote:\n> > Mira, I'll send the Alderline proposal by Friday at noon.\n> > \n> > -- \n> > Rowan"
  promises:
  - id: p1
    message: m1
    owner: rowan@example.com
    what: Send the Alderline proposal
    due: Friday at noon
  expected_open_promises: []
  resolutions:
  - message: m3
    promise: p1
    type: done
    why: The promised proposal is delivered.
