# Promise examples for phase S's evaluation cases (2026-10-17). Drafted with an outside assistant at the owner's
# request and reviewed: 120 items (34 promises by the person, 35 to the person, 31 not promises, 20 resolutions, four of
# each kind); every resolution points to the right earlier item and owner (checked by script). Review changes: item 30,
# a promise to hold back, is not a promise to track. Notes for turning them into cases: each needs a received date and
# starting records (the earlier promise for a resolution); vague dates stay as written and show as "no date" (TBD);
# "non_answer" on the person's own promise means the message doesn't keep it, and it stays open; keeping a
# draft confidential (item 64) is an ongoing promise made to the person, with no deadline, shown with no date.
# Fictional promise-tracking examples. All addresses use example.com.
# User identity: Rowan (rowan@example.com). External promises are addressed to Rowan.
# resolves.item is the one-based position of an earlier item in this list.
# Resolution types partial and non_answer leave the earlier obligation open.
# Relative/vague dates are preserved because no message timestamp is supplied.
# For two promises, due is a list of action/due pairs; otherwise a string or null.
# owner is null for non-promises, including quoted earlier commitments.
